<script>
const DATA = {"tickets":{"43":{"assignees":["acme-dev"],"body":"## Question\n\nSurvey the push-notification provider landscape so the taxonomy grill can pick one:\n\n- **Native paths** — APNs and FCM direct: token lifecycle, quotas, payload limits.\n- **Aggregators** — OneSignal, Pusher Beams, Expo: pricing, web support, vendor lock-in.\n- **Web push** — VAPID keys, browser coverage, permission UX.\n\n**Method:** `/research` against provider docs. AFK — no decisions here, just the field of options. Link the asset from this issue on resolution.\n","html_url":"https://github.com/acme/example/issues/43","labels":["wayfinder:research"],"number":43,"state":"closed","title":"Research: the push-provider landscape"},"44":{"assignees":["acme-dev"],"body":"## Question\n\nDecide the notification taxonomy — this becomes the delivery rulebook:\n\n- **Classes** — transactional, digest, marketing; which exist at launch?\n- **Defaults** — which classes are on by default, and what the user can mute.\n- **Quiet hours** — per-user window or global?\n- **Escalation** — when does an unread in-app notification become a push?\n\nDepends on the provider survey ([#43](https://github.com/acme/example/issues/43)).\n\n**Method:** `/grilling` + `/domain-modeling`, one question at a time. HITL.\n","html_url":"https://github.com/acme/example/issues/44","labels":["wayfinder:grilling"],"number":44,"state":"closed","title":"Grill: notification taxonomy + defaults"},"45":{"assignees":["acme-dev"],"body":"## Question\n\nSettle what the shell badge means:\n\n- **Count vs dot** — a number per surface, or presence-only?\n- **What counts** — unread notifications, or unread *actionable* ones?\n- **Clearing** — on open, on read, or on explicit dismiss?\n\n**Method:** `/grilling`. HITL. The answer feeds the data model and the shell look.\n","html_url":"https://github.com/acme/example/issues/45","labels":["wayfinder:grilling"],"number":45,"state":"closed","title":"Badge semantics: counts vs dots"},"46":{"assignees":["acme-dev"],"body":"## Question\n\nPin the record shapes:\n\n- **Notification** — class, payload, target surface, created/read/dismissed timestamps.\n- **Read state** — per-device or per-account? How the badge count derives from it.\n- **Retention** — cap by age or count; what the tray reads.\n\nBlocked by the taxonomy ([#44](https://github.com/acme/example/issues/44)).\n\n**Method:** `/grilling` + `/domain-modeling`. HITL. Update `CONTEXT.md` as terms lock.\n","html_url":"https://github.com/acme/example/issues/46","labels":["wayfinder:grilling"],"number":46,"state":"closed","title":"Data model: notification records + read state"},"47":{"assignees":["acme-dev"],"body":"## Question\n\nDesign how a notification gets created and delivered:\n\n- **The `/notify` skill** — fetch defaults, apply the taxonomy rules, write via the CLI.\n- **CLI contract** — subcommands and `--json` shapes; deterministic I/O only.\n- **Fan-out** — when a write also triggers a push, and how failures surface.\n\n**Method:** `/grilling`. HITL. Depends on the taxonomy, badge semantics, and data model.\n","html_url":"https://github.com/acme/example/issues/47","labels":["wayfinder:grilling"],"number":47,"state":"closed","title":"Delivery surface: the /notify CLI contract"},"48":{"assignees":["acme-dev"],"body":"## Question\n\nConverge the badge + tray look:\n\n- **Badge** — placement on the shell, count rendering, the zero state.\n- **Tray** — list density, grouping by class, mark-all-read.\n- **Empty state** — first-run copy.\n\n**Method:** `/grilling-frontend-prototyping` — rounds of concrete variants + verdicts. HITL. Depends on the data model ([#46](https://github.com/acme/example/issues/46)).\n","html_url":"https://github.com/acme/example/issues/48","labels":["wayfinder:prototype"],"number":48,"state":"closed","title":"The look: shell badge + tray"},"49":{"assignees":["acme-dev"],"body":"## Question\n\nManual setup that unblocks the delivery decisions: create the sandbox account at the surveyed provider, register the app identifiers, and store the API keys in the team vault.\n\nResolution records where the credentials live and any limits found. AFK where possible; a checklist is handed over otherwise.\n","html_url":"https://github.com/acme/example/issues/49","labels":["wayfinder:task"],"number":49,"state":"closed","title":"Provision the push-provider sandbox"},"50":{"assignees":["acme-dev"],"body":"## Question\n\nOne-time bootstrap so the first delivery tests run against real devices: register two test devices, capture their tokens, and store them with the sandbox credentials.\n\nBlocked by the sandbox ([#49](https://github.com/acme/example/issues/49)) and the taxonomy ([#44](https://github.com/acme/example/issues/44)).\n\n**Method:** HITL — needs the physical devices.\n","html_url":"https://github.com/acme/example/issues/50","labels":["wayfinder:task"],"number":50,"state":"closed","title":"Bootstrap: seed real device tokens"},"51":{"assignees":["acme-dev"],"body":"## Question\n\nDoes a daily digest email earn its place at launch? Build a throwaway template over the real record shapes and judge it:\n\n- **Grouping** — by surface or by class?\n- **Volume** — what a heavy day looks like; truncation rules.\n\n**Method:** `/prototype`. HITL. Depends on the data model ([#46](https://github.com/acme/example/issues/46)).\n","html_url":"https://github.com/acme/example/issues/51","labels":["wayfinder:prototype"],"number":51,"state":"closed","title":"Prototype: digest email template"},"78":{"assignees":[],"body":"## Question\n\nSurvey how usage-based products meter consumption:\n\n- **Event-sourced meters** vs periodic snapshots — accuracy, replay, cost.\n- **Aggregation windows** — hourly vs daily rollups; late-event handling.\n- **Precedents** — how established billing platforms model meters.\n\nDeliverable: committed research doc. AFK — resolve via `/research`.\n","html_url":"https://github.com/acme/example/issues/78","labels":["wayfinder:research"],"number":78,"state":"open","title":"Research: usage-metering approaches"},"79":{"assignees":[],"body":"## Question\n\nWhich provider issues the invoices? Survey and rank:\n\n- **The incumbent option** — line-item limits, proration, tax handling.\n- **Alternatives** — fees, dunning behavior, API shape.\n\nDeliverable: committed doc + a ranked recommendation — closing this ticket = the provider is **selected**. AFK — resolve via `/research`.\n","html_url":"https://github.com/acme/example/issues/79","labels":["wayfinder:research"],"number":79,"state":"open","title":"Research: invoicing provider APIs"},"80":{"assignees":[],"body":"## Question\n\nDecide what we charge for:\n\n- **Dimensions** — seats, API calls, storage; which are live at launch?\n- **Rounding** — per-unit rounding rules and minimums.\n- **Free tier** — included allowances and overage behavior.\n\nHITL — resolve via `/grilling`.\n","html_url":"https://github.com/acme/example/issues/80","labels":["wayfinder:grilling"],"number":80,"state":"open","title":"Grill: pricing dimensions + rounding rules"},"81":{"assignees":[],"body":"## Question\n\nDomain model for billing under a store-facts / derive-judgements discipline:\n\n- **Meter** — identity, unit, aggregation.\n- **Invoice** — line items, status lifecycle, immutability after issue.\n- **Credit** — grants, expiry, application order.\n\nHITL — resolve via `/grilling` + `/domain-modeling`.\n","html_url":"https://github.com/acme/example/issues/81","labels":["wayfinder:grilling"],"number":81,"state":"open","title":"Grill: data model — meters, invoices, credits"},"82":{"assignees":[],"body":"## Question\n\nWhat does the invoice detail view look like? Line-item table density, proration rendering, the credits section, and the PDF export treatment.\n\nHITL — resolve via `/grilling-frontend-prototyping` converging variant loop.\n","html_url":"https://github.com/acme/example/issues/82","labels":["wayfinder:prototype"],"number":82,"state":"open","title":"Prototype: the invoice detail look"},"83":{"assignees":[],"body":"## Question\n\nHow do existing flat-rate customers move to usage-based plans?\n\n- **Grandfathering** — who keeps the old price, and for how long.\n- **Cutover** — mid-cycle switch mechanics and proration.\n- **Comms** — notice period and messaging.\n\nHITL — resolve via `/grilling`.\n","html_url":"https://github.com/acme/example/issues/83","labels":["wayfinder:grilling"],"number":83,"state":"open","title":"Grill: migration path for legacy plans"},"84":{"assignees":[],"body":"## Question\n\nManual setup that unblocks the invoicing decisions: create the provider sandbox, seed a test tenant with fake usage, and store credentials in the team vault.\n\nResolution records the credential location and any sandbox limits. AFK where possible.\n","html_url":"https://github.com/acme/example/issues/84","labels":["wayfinder:task"],"number":84,"state":"open","title":"Provision the billing sandbox + test tenant"}},"edges":{"43":[],"44":[43],"45":[],"46":[44],"47":[44,45,46],"48":[46],"49":[],"50":[49,44],"51":[46],"78":[],"79":[],"80":[],"81":[],"82":[],"83":[],"84":[]},"datasets":[{"id":"replay","short":"notifs\nreplay","label":"app notifications · map #42 (replay)","note":"demo tickets + blocked-by edges, replayed mid-flight: all four lanes populated","map":42,"tickets":[43,44,45,46,47,48,49,50,51],"overrides":{"43":{"state":"closed"},"44":{"state":"open","assignees":["acme-dev"]},"45":{"state":"closed"},"46":{"state":"open","assignees":[]},"47":{"state":"open","assignees":[]},"48":{"state":"open","assignees":[]},"49":{"state":"open","assignees":[]},"50":{"state":"open","assignees":[]},"51":{"state":"open","assignees":[]}}},{"id":"frontier","short":"billing\nall-frontier","label":"billing revamp · map #77","note":"live demo state: 7 tickets, every one open, unblocked, unclaimed — the all-frontier shape","map":77,"tickets":[78,79,80,81,82,83,84],"overrides":{}},{"id":"done","short":"notifs\nall-done","label":"app notifications · map #42 (today)","note":"all 9 demo tickets resolved — the finished-map shape, historical edges only","map":42,"tickets":[43,44,45,46,47,48,49,50,51],"overrides":{}}],"generatedAt":"Aug 2 at 1:00 PM"};

const EMOJI = { grilling: "🗣️", task: "🔨", research: "🔎", prototype: "🧪" };
const LANE_DEF = {
  blocked:    { name: "Blocked" },
  frontier:   { name: "Frontier" },
  inprogress: { name: "In progress" },
  resolved:   { name: "Resolved" },
};
const ORDER_FINAL = ["inprogress", "frontier", "blocked", "resolved"];
const LANE_NAME = Object.fromEntries(Object.entries(LANE_DEF).map(([k, v]) => [k, v.name]));

function typeOf(labels) {
  for (const l of labels) {
    const m = /^wayfinder:(grilling|task|research|prototype)$/.exec(l);
    if (m) return m[1];
  }
  return "task";
}

function resolveDataset(ds) {
  const ts = ds.tickets.map(n => {
    const base = DATA.tickets[n];
    const o = (ds.overrides && ds.overrides[n]) || {};
    return { ...base, ...o };
  });
  const byN = Object.fromEntries(ts.map(t => [t.number, t]));
  for (const t of ts) {
    t.type = typeOf(t.labels);
    t.emoji = EMOJI[t.type];
    t.ready = t.state === "closed" ? "✓" :
      t.labels.includes("ready-for-agent") ? "🤖" : "🫵";
    const edges = (DATA.edges[t.number] || []).filter(b => byN[b]);
    t.blockers = edges;
    t.openBlockers = edges.filter(b => byN[b].state === "open");
    t.lane = t.state === "closed" ? "resolved"
      : t.openBlockers.length ? "blocked"
      : (t.assignees && t.assignees.length) ? "inprogress"
      : "frontier";
  }
  return { tickets: ts, byN };
}

function laneGroups(res) {
  const g = { blocked: [], frontier: [], inprogress: [], resolved: [] };
  for (const t of res.tickets) g[t.lane].push(t);
  return g;
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
}

/* ---- tiny markdown renderer ---- */
function md(src) {
  const lines = src.replace(/\r/g, "").split("\n");
  let out = "", inList = false, inPre = false, pre = [];
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|\s)(#(\d{1,4}))\b/g, '$1<b>$2</b>');
  const closeList = () => { if (inList) { out += "</ul>"; inList = false; } };
  for (const raw of lines) {
    if (inPre) {
      if (/^```/.test(raw)) { out += "<pre><code>" + esc(pre.join("\n")) + "</code></pre>"; inPre = false; pre = []; }
      else pre.push(raw);
      continue;
    }
    if (/^```/.test(raw)) { closeList(); inPre = true; continue; }
    const h = /^(#{1,4})\s+(.*)/.exec(raw);
    if (h) { closeList(); const lv = Math.min(h[1].length + 1, 4); out += `<h${lv}>${inline(h[2])}</h${lv}>`; continue; }
    const li = /^\s*[-*]\s+(.*)/.exec(raw);
    if (li) { if (!inList) { out += "<ul>"; inList = true; } out += "<li>" + inline(li[1]) + "</li>"; continue; }
    closeList();
    if (raw.trim() === "") continue;
    out += "<p>" + inline(raw) + "</p>";
  }
  if (inPre) out += "<pre><code>" + esc(pre.join("\n")) + "</code></pre>";
  closeList();
  return out;
}

/* ---------------- render ---------------- */

function waitCell(t, byN) {
  return t.blockers.map(b => {
    const open = byN[b].state === "open";
    return `<span class="wref ${open ? "" : "hist"}" data-ref="${b}">#${b}</span>`;
  }).join("");
}

function render(res, ds, v) {
  const g = laneGroups(res);
  const order = ORDER_FINAL;
  let h = `<div class="v-classic">`;

  // header
  const mapUrl = `https://github.com/acme/example/issues/${ds.map}`;
  if (v.headerMeta) {
    h += `<div class="board-title"><a href="${mapUrl}" target="_blank" rel="noopener">
          <b>lanes</b> · ${esc(ds.label)} ↗</a></div>`;
    const counts = order.map(l =>
      `<span class="m-cnt c-${l}">${g[l].length} ${LANE_NAME[l].toLowerCase()}</span>`).join(" · ");
    h += `<div class="board-sub">${counts} · generated ${esc(DATA.generatedAt)}</div>`;
  } else {
    h += `<div class="board-title"><b>lanes</b> · ${esc(ds.label)}</div>
          <div class="board-sub">${esc(ds.note)}</div>`;
  }

  h += `<div class="legend"><span class="l-blk"><i></i>waits on (blockers)</span>
        <span class="l-dep"><i></i>unblocks (dependents)</span></div>`;

  if (v.strip) {
    h += `<div class="strip">`;
    for (const l of order)
      h += `<div class="stat s-${l} ${g[l].length ? "" : "s-zero"}">
            <b>${g[l].length}</b><span>${LANE_NAME[l]}</span></div>`;
    h += `</div>`;
  }

  h += `<div class="grid-wrap"><table>
    <thead><tr><th>#</th><th>Type</th><th>Title</th><th>Assignee</th><th>Waiting on</th></tr></thead><tbody>`;
  for (const lane of order) {
    const ts = g[lane];
    if (!ts.length && v.hideEmpty) continue;
    const collapsed = v.collapseResolved && lane === "resolved" && ts.length > 0;
    h += `<tr class="sec sec-${lane}" data-sec="${lane}"><td colspan="5">
          <span class="chev">${collapsed ? "▸" : "▾"}</span>${LANE_NAME[lane]}
          <span class="cnt">${ts.length}</span></td></tr>`;
    if (!ts.length) { h += `<tr class="zero"><td colspan="5">none</td></tr>`; continue; }
    for (const t of ts) {
      h += `<tr class="t ${t.state === "closed" ? "done" : ""} ${collapsed ? "hidden-lane" : ""}"
        data-t="${t.number}" data-lane="${lane}">
        <td class="num">#${t.number}</td>
        <td class="emo">${t.emoji}${t.state === "open" ? t.ready : "✓"}</td>
        <td class="title">${esc(t.title)}</td>
        <td class="who">${t.state === "open" && t.assignees.length ? "@" + esc(t.assignees[0]) : ""}</td>
        <td class="wait">${waitCell(t, res.byN)}</td></tr>`;
    }
  }
  return h + `</tbody></table></div></div>`;
}

/* the converged design: In progress → Frontier → Blocked → Resolved,
   summary strip, empty lanes hidden (strip still shows 0), Resolved collapsed */
const CONFIG = { strip: true, hideEmpty: true, collapseResolved: true };

let di = 0, current = null;

function paint() {
  const ds = DATA.datasets[di];
  current = resolveDataset(ds);
  document.getElementById("stage").innerHTML = render(current, ds, CONFIG);
  document.querySelectorAll("#datasets button").forEach((b, i) =>
    b.classList.toggle("on", i === di));
}

/* ---------------- two-way spotlight ---------------- */

function rowOf(n) { return document.querySelector(`tr.t[data-t="${n}"]`); }

function clearFx() {
  document.querySelectorAll(".fx-keep, .fx-src, .fx-blk, .fx-dep").forEach(el =>
    el.classList.remove("fx-keep", "fx-src", "fx-blk", "fx-dep"));
  const tb = document.querySelector("#stage table");
  if (tb) tb.classList.remove("fx-on");
}

function spotlight(srcRow, pairs) {
  // pairs: [{row, cls}]
  const tb = document.querySelector("#stage table");
  if (!tb || !pairs.length) return;
  tb.classList.add("fx-on");
  if (srcRow) srcRow.classList.add("fx-src", "fx-keep");
  for (const { row, cls } of pairs) { row.classList.add(cls, "fx-keep"); }
}

function fxForRow(tr) {
  const n = +tr.dataset.t;
  const t = current.byN[n];
  if (!t) return;
  const pairs = [];
  for (const b of t.blockers) { const r = rowOf(b); if (r) pairs.push({ row: r, cls: "fx-blk" }); }
  for (const other of current.tickets)
    if (other.blockers.includes(n)) { const r = rowOf(other.number); if (r) pairs.push({ row: r, cls: "fx-dep" }); }
  spotlight(tr, pairs);
}

function fxForChip(chip) {
  const row = rowOf(+chip.dataset.ref);
  const src = chip.closest("tr.t");
  if (row) spotlight(src, [{ row, cls: "fx-blk" }]);
}

const stage = document.getElementById("stage");
stage.addEventListener("mouseover", e => {
  clearFx();
  const chip = e.target.closest(".wref");
  if (chip) { fxForChip(chip); return; }
  const tr = e.target.closest("tr.t");
  if (tr) fxForRow(tr);
});
stage.addEventListener("mouseleave", clearFx);

/* clicks: chips jump, sections collapse, rows open the modal */
stage.addEventListener("click", e => {
  const chip = e.target.closest(".wref");
  if (chip) {
    e.stopPropagation();
    const row = rowOf(+chip.dataset.ref);
    if (row) {
      row.classList.remove("hidden-lane");
      row.scrollIntoView({ behavior: "smooth", block: "center" });
      row.classList.remove("flash"); void row.offsetWidth;
      row.classList.add("flash");
    }
    return;
  }
  const sec = e.target.closest("tr.sec");
  if (sec) {
    const lane = sec.dataset.sec;
    const rows = document.querySelectorAll(`tr.t[data-lane="${lane}"]`);
    const collapsed = rows.length && rows[0].classList.contains("hidden-lane");
    rows.forEach(r => r.classList.toggle("hidden-lane", !collapsed));
    const chev = sec.querySelector(".chev");
    if (chev) chev.textContent = collapsed ? "▾" : "▸";
    return;
  }
  const el = e.target.closest("tr.t");
  if (el) openModal(+el.dataset.t);
}, true);

/* ---------------- modal ---------------- */
function openModal(n) {
  const t = current.byN[n];
  document.getElementById("m-title").innerHTML =
    `${t.emoji} <span class="m-num">#${t.number}</span> ${esc(t.title)}`;
  const meta = [`<span class="lane-chip">${LANE_NAME[t.lane]}</span>`,
    `<span>${t.type}</span>`];
  if (t.assignees.length) meta.push(`<span>@${esc(t.assignees[0])}</span>`);
  if (t.blockers.length) meta.push(`<span>blocked by ${t.blockers.map(b => "#" + b).join(", ")}</span>`);
  document.getElementById("m-meta").innerHTML = meta.join("");
  document.getElementById("m-body").innerHTML = md(t.body || "*no description*");
  document.getElementById("m-link").href = t.html_url;
  document.getElementById("scrim").classList.add("open");
}
document.getElementById("scrim").addEventListener("click", e => {
  if (e.target.id === "scrim") e.currentTarget.classList.remove("open");
});
document.getElementById("m-close").addEventListener("click", () =>
  document.getElementById("scrim").classList.remove("open"));

/* ---------------- picker wiring ---------------- */
document.addEventListener("keydown", e => {
  if (e.key === "Escape") document.getElementById("scrim").classList.remove("open");
  if (e.key >= "1" && e.key <= String(DATA.datasets.length)) { di = +e.key - 1; paint(); }
});
const dsBox = document.getElementById("datasets");
DATA.datasets.forEach((ds, i) => {
  const b = document.createElement("button");
  b.textContent = ds.short;
  b.addEventListener("click", () => { di = i; paint(); });
  dsBox.appendChild(b);
});

/* drag the picker */
(() => {
  const p = document.getElementById("picker"), h = document.getElementById("picker-drag");
  let sx, sy, ox, oy, dragging = false;
  h.addEventListener("pointerdown", e => {
    dragging = true; sx = e.clientX; sy = e.clientY;
    const r = p.getBoundingClientRect(); ox = r.left; oy = r.top;
    h.setPointerCapture(e.pointerId);
  });
  h.addEventListener("pointermove", e => {
    if (!dragging) return;
    const x = Math.min(Math.max(0, ox + e.clientX - sx), innerWidth - p.offsetWidth);
    const y = Math.min(Math.max(0, oy + e.clientY - sy), innerHeight - p.offsetHeight);
    p.style.left = x + "px"; p.style.top = y + "px";
    p.style.right = "auto"; p.style.bottom = "auto";
  });
  h.addEventListener("pointerup", () => dragging = false);
})();

paint();
</script>
